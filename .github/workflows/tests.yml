name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        working-directory: Workout
        run: swiftlint lint --reporter github-actions-logging

  test:
    name: Build and Test
    runs-on: xcode-27
    # The Xcode 27 image is public preview — no SLA. Don't let it block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # Ask xcodebuild what IT can target. Incompatible entries always carry an
      # `error:` field, so filter on that rather than on section headings —
      # the heading wording changes between Xcode releases.
      - name: Pick a simulator
        id: sim
        working-directory: Workout
        run: |
          pick() {
            xcodebuild -project Workout.xcodeproj -scheme Workout \
                       -showdestinations 2>/dev/null \
              | tr -d '{}' \
              | grep 'platform:iOS Simulator' \
              | grep -v 'error:' \
              | grep -v 'placeholder' \
              | grep -v 'Designed for' \
              | grep 'name:iPhone' \
              | grep 'OS:' \
              | sed -E 's/.*OS:([0-9.]+).*name:[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1|\2/' \
              || true
          }

          LINES=$(pick)

          if [ -z "$LINES" ]; then
            echo "No

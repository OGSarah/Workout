name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        working-directory: Workout
        run: swiftlint lint --reporter github-actions-logging

  test:
    name: Build and Test
    runs-on: xcode-27
    # The Xcode 27 image is public preview - no SLA. Don't let it block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # Ask xcodebuild what IT can target. Incompatible entries always carry an
      # error: field, so filter on that rather than on section headings -
      # the heading wording changes between Xcode releases.
      - name: Pick a simulator
        id: sim
        working-directory: Workout
        run: |
          pick() {
            xcodebuild -project Workout.xcodeproj -scheme Workout -showdestinations 2>/dev/null \
              | tr -d '{}' \
              | grep 'platform:iOS Simulator' \
              | grep -v 'error:' \
              | grep -v 'placeholder' \
              | grep -v 'Designed for' \
              | grep 'name:iPhone' \
              | grep 'OS:' \
              | sed -E 's/.*OS:([0-9.]+).*name:[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1|\2/' \
              || true
          }

          LINES=$(pick)

          if [ -z "$LINES" ]; then
            echo 'No iOS Simulator destinations found. Installing the iOS platform.'
            xcodebuild -downloadPlatform iOS
            LINES=$(pick)
          fi

          if [ -z "$LINES" ]; then
            echo '::error::No iOS Simulator destination for the selected Xcode.'
            xcodebuild -version || true
            xcodebuild -project Workout.xcodeproj -scheme Workout -showdestinations || true
            exit 1
          fi

          # Newest runtime, then the shortest device name in it,
          # which prefers plain iPhone models over Pro Max variants.
          OS=$(printf '%s\n' "$LINES" | cut -d'|' -f1 | sort -V | tail -1)
          NAME=$(printf '%s\n' "$LINES" \
            | awk -F'|' -v os="$OS" '$1 == os { print $2 }' \
            | awk '{ print length, $0 }' \
            | sort -n | head -1 | cut -d' ' -f2-)

          echo "os=$OS" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Selected $NAME on iOS $OS"

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Run tests
        working-directory: Workout
        run: |
          set -o pipefail
          xcodebuild test \
            -project Workout.xcodeproj \
            -scheme Workout \
            -testPlan Workout \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=${{ steps.sim.outputs.os }}" \
            -resultBundlePath TestResults.xcresult \
            -only-testing:WorkoutTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: Workout/TestResults.xcresult
          if-no-files-found: warn

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        working-directory: Workout
        run: swiftlint lint --reporter github-actions-logging
   test:
      name: Build and Test (${{ matrix.runner }})
      runs-on: ${{ matrix.runner }}
      # The Xcode 27 image is public preview — no SLA. Don't let it block merges.
      continue-on-error: ${{ matrix.experimental }}
      strategy:
        fail-fast: false
        matrix:
          include:
            # Forward-looking leg: image IS the toolchain, no setup-xcode needed.
            - runner: xcode-27
              xcode: ''
              experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Only runs on the macos-26 leg. On xcode-27 the image already
      # provides Xcode 27 as the default and only major version.
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      # Resolves the newest installed iOS runtime and the base iPhone model
      # within it, so a device rename on a new image doesn't break the build.
      - name: Pick a simulator
        id: sim
        run: |
          JSON=$(xcrun simctl list devices available --json)

          RUNTIME=$(echo "$JSON" | jq -r '
            [.devices | keys[] | select(test("SimRuntime\\.iOS-"))]
            | sort_by(capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)")
                      | [(.a | tonumber), (.b | tonumber)])
            | last // empty')

          if [ -z "$RUNTIME" ]; then
            echo "::error::No iOS simulator runtimes installed on this image."
            exit 1
          fi

          NAME=$(echo "$JSON" | jq -r --arg rt "$RUNTIME" '
            [.devices[$rt][]
             | select(.isAvailable)
             | .name
             | select(startswith("iPhone"))]
            | sort_by(length) | first // empty')

          if [ -z "$NAME" ]; then
            echo "::error::No available iPhone simulator for runtime $RUNTIME."
            exit 1
          fi

          OS=$(echo "$RUNTIME" | sed -E 's/.*iOS-([0-9]+)-([0-9]+)$/\1.\2/')

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "os=$OS"     >> "$GITHUB_OUTPUT"
          echo "Using $NAME on iOS $OS"

      - name: Install xcbeautify
        run: brew install xcbeautify
